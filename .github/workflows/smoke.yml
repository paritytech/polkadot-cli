name: Live smoke test

# Runs the built CLI against real public RPC: reads on every built-in chain,
# a probe of every bundled endpoint, and a remark + transfer on Paseo Asset Hub
# signed by a dedicated CI account (secret PASEO_CI_MNEMONIC). Kept out of the
# main CI job so a flaky public node never blocks a merge.
#
# Pull requests from forks get no secrets, so they run the reads only and skip
# the transactions. Never switch this to pull_request_target: that would hand
# the CI key to code from an untrusted fork.
#
# Refill the CI account from https://faucet.polkadot.io (Paseo Asset Hub):
# 133zRsGWUFGpB9Xr3ELsULuTDcJHuZqZSgB8WmhjXXgxxcSg

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

# A new push to the same PR replaces its in-flight run. Runs on different PRs
# proceed side by side; scripts/smoke.ts retries if they race on the nonce.
concurrency:
  group: smoke-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: bun install --frozen-lockfile

      - run: bun run build

      - run: bun run smoke
        env:
          PASEO_CI_MNEMONIC: ${{ secrets.PASEO_CI_MNEMONIC }}
